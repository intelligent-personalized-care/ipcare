openapi: 3.0.3
info:
  title: Intelligent Personalized Care API
  version: 2.0.0
  description: Current backend HTTP contract. User roles and routes use PATIENT and PHYSIOTHERAPIST terminology.
    Catalogue exerciseID is a UUID; execution exerciseID is an assigned daily-exercise integer. Examples are synthetic.
    Protected operations use Bearer access tokens; physiotherapist-only operations generally also require approved
    credentials.
servers:
- url: http://localhost:8080
  description: Local development
- url: https://organic-byway-391719.ew.r.appspot.com
  description: Configured hosted endpoint; availability not verified
tags:
- name: Users
- name: Patients
- name: Physiotherapists
- name: Plans
- name: Exercises
- name: Execution
- name: Admin
paths:
  /admin/unverified_physiotherapists:
    get:
      tags:
      - Admin
      summary: Get unverified physiotherapists
      operationId: get_admin_unverified_physiotherapists
      description: 'Get unverified physiotherapists. Authorization: administrator.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfUnverifiedPhysiotherapists'
              example:
                physiotherapists:
                - id: 10000000-0000-4000-8000-000000000001
                  name: Example Patient
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /admin/unverified_physiotherapists/{physiotherapistID}:
    get:
      tags:
      - Admin
      summary: Credential of physiotherapist
      operationId: get_admin_unverified_physiotherapists_physiotherapistID
      description: 'Credential of physiotherapist. Authorization: administrator.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
    post:
      tags:
      - Admin
      summary: Decide credential of physiotherapist
      operationId: post_admin_unverified_physiotherapists_physiotherapistID
      description: 'Decide credential of physiotherapist. Authorization: administrator.'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No content.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
            example:
              accept: true
  /users/physiotherapists:
    post:
      tags:
      - Physiotherapists
      summary: Register physiotherapist
      operationId: post_users_physiotherapists
      description: Register physiotherapist.
      security: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsOutput'
              example:
                id: 10000000-0000-4000-8000-000000000001
                accessToken: <accessToken>
                refreshToken: <refreshToken>
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            example:
              email: physiotherapist@example.test
              name: Example Physiotherapist
              password: Example-password1@
    get:
      tags:
      - Patients
      summary: Search physiotherapists available
      operationId: get_users_physiotherapists
      description: 'Search approved physiotherapists by a case-insensitive literal name fragment. A missing or blank
        name lists all approved physiotherapists. Results have a stable name/ID order. No matches returns HTTP 200
        with {"physiotherapists": []}. Authorization: authenticated patient.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllPhysiotherapistsAvailableOutput'
              example:
                physiotherapists:
                - id: 10000000-0000-4000-8000-000000000001
                  name: Example Patient
                  email: patient@example.test
                  rating:
                    averageStarts: 1
                    nrOfReviews: 1
                  requested: true
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
  /users/physiotherapists/{physiotherapistID}/credential:
    post:
      tags:
      - Physiotherapists
      summary: Post credential of physiotherapist
      operationId: post_users_physiotherapists_physiotherapistID_credential
      description: 'Upload multipart/form-data with the file part named credential. Only the owner may submit; this
        route is allowed before credential approval. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - credential
              properties:
                credential:
                  type: string
                  format: binary
  /users/physiotherapists/{physiotherapistID}/profile:
    get:
      tags:
      - Physiotherapists
      summary: Physiotherapist profile
      operationId: get_users_physiotherapists_physiotherapistID_profile
      description: 'Physiotherapist profile. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysiotherapistProfile'
              example:
                id: 10000000-0000-4000-8000-000000000001
                name: Example Patient
                email: patient@example.test
                rating:
                  averageStarts: 1
                  nrOfReviews: 1
                docState: invalid
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
  /users/physiotherapists/{physiotherapistID}/patients:
    get:
      tags:
      - Physiotherapists
      summary: Get patients of physiotherapist
      operationId: get_users_physiotherapists_physiotherapistID_patients
      description: 'Get patients of physiotherapist. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfPatients'
              example:
                patients:
                - id: 10000000-0000-4000-8000-000000000001
                  name: Example Patient
                  email: patient@example.test
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
  /users/physiotherapists/{physiotherapistID}/patients/{patientID}:
    get:
      tags:
      - Physiotherapists
      summary: Patient of physiotherapist
      operationId: get_users_physiotherapists_physiotherapistID_patients_patientID
      description: 'Patient of physiotherapist. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOfPhysiotherapist'
              example:
                id: 10000000-0000-4000-8000-000000000001
                name: Example Patient
                email: patient@example.test
                weight: 1
                height: 1
                physicalCondition: Example physicalCondition
                birthDate: '2026-09-20'
                plans:
                - id: 1
                  title: Wrist rehabilitation
                  startDate: '2026-09-20'
                  endDate: '2026-09-20'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      - name: patientID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
    delete:
      tags:
      - Physiotherapists
      summary: End patient connection
      operationId: delete_users_physiotherapists_physiotherapistID_patients_patientID
      description: 'End patient connection. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No content.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      - name: patientID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
  /users/physiotherapists/{physiotherapistID}:
    get:
      tags:
      - Physiotherapists
      summary: Get physiotherapist
      operationId: get_users_physiotherapists_physiotherapistID
      description: 'Get physiotherapist. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysiotherapistDetails'
              example:
                id: 10000000-0000-4000-8000-000000000001
                name: Example Patient
                email: patient@example.test
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
    post:
      tags:
      - Patients
      summary: Make request for physiotherapist
      operationId: post_users_physiotherapists_physiotherapistID
      description: 'Make request for physiotherapist. Authorization: patient owner (or assigned physiotherapist
        on shared result/profile routes).'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestIdOutput'
              example:
                requestID: 10000000-0000-4000-8000-000000000001
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
            example:
              patientID: 10000000-0000-4000-8000-000000000001
              text: Please supervise my rehabilitation.
  /users/physiotherapists/{physiotherapistID}/requests/{requestID}:
    post:
      tags:
      - Physiotherapists
      summary: Decide request
      operationId: post_users_physiotherapists_physiotherapistID_requests_requestID
      description: 'Returns 200 with the patient list when accepting; 204 with no body when rejecting. Authorization:
        physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfPatients'
              example:
                patients:
                - id: 10000000-0000-4000-8000-000000000001
                  name: Example Patient
                  email: patient@example.test
        '204':
          description: No content.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      - name: requestID
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Resource identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
            example:
              accept: true
  /users/physiotherapists/{physiotherapistID}/profile/photo:
    post:
      tags:
      - Physiotherapists
      summary: Add profile picture
      operationId: post_users_physiotherapists_physiotherapistID_profile_photo
      description: 'Add profile picture. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - photo
              properties:
                photo:
                  type: string
                  format: binary
  /users/physiotherapists/{physiotherapistID}/requests:
    get:
      tags:
      - Physiotherapists
      summary: Get physiotherapist requests
      operationId: get_users_physiotherapists_physiotherapistID_requests
      description: 'Get physiotherapist requests. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestsOfPhysiotherapist'
              example:
                requests:
                - requestID: 10000000-0000-4000-8000-000000000001
                  requestText: Example requestText
                  patientID: 10000000-0000-4000-8000-000000000001
                  patientName: Example patientName
                  patientEmail: patient@example.test
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
  /users/physiotherapists/{physiotherapistID}/plans:
    post:
      tags:
      - Plans
      summary: Create plan of physiotherapist
      operationId: post_users_physiotherapists_physiotherapistID_plans
      description: 'Creates a reusable template. Each exercise may omit sensorProfile to inherit catalogue defaults
        or include a per-day override used by both execution modes. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanID'
              example:
                id: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
            example:
              title: Wrist rehabilitation
              dailyLists:
              - exercises:
                - exerciseInfoID: 73a20000-cc31-4c29-9000-000000000001
                  sets: 2
                  reps: 10
              - null
              - exercises:
                - exerciseInfoID: 73a20000-cc31-4c29-9000-000000000001
                  sets: 2
                  reps: 10
                  sensorProfile:
                    raiseThreshold: 40.0
                    lowerThreshold: 5.0
                    minRaiseTimeMs: 1000
                    holdTimeMs: 5000
                    cooldownMs: 1000
                    minMovementSpeed: 0.0
                    minPitch: -20.0
                    maxPitch: 20.0
                    minRoll: -10.0
                    maxRoll: 60.0
                    useRoll: true
                    movementDirection: 1
    get:
      tags:
      - Plans
      summary: Get plans of physiotherapist
      operationId: get_users_physiotherapists_physiotherapistID_plans
      description: 'Get plans of physiotherapist. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfPlans'
              example:
                plans:
                - id: 1
                  title: Wrist rehabilitation
                  days: 1
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
  /users/physiotherapists/{physiotherapistID}/patients/{patientID}/plans:
    post:
      tags:
      - Plans
      summary: Associate plan for patient
      operationId: post_users_physiotherapists_physiotherapistID_patients_patientID_plans
      description: 'Assigns a copy of the template to the patient starting on startDate. Reassigning the same template
        produces independent plan, daily-list and exercise IDs. Afterwards fetch the patient plan and use its IDs
        for execution routes. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No content.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      - name: patientID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanToPatient'
            example:
              planID: 1
              startDate: '2026-09-20'
  /users/physiotherapists/{physiotherapistID}/plans/{planID}:
    get:
      tags:
      - Plans
      summary: Get plan of physiotherapist by id
      operationId: get_users_physiotherapists_physiotherapistID_plans_planID
      description: 'Get plan of physiotherapist by id. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanOutput'
              example:
                id: 1
                title: Wrist rehabilitation
                startDate: '2026-09-20'
                dailyLists:
                - id: 1
                  exercises:
                  - id: 1
                    exerciseInfoID: 10000000-0000-4000-8000-000000000001
                    title: Wrist rehabilitation
                    description: Example description
                    type: Example type
                    sets: 1
                    reps: 1
                    isDone: true
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      parameters:
      - name: physiotherapistID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource identifier.
      - name: planID
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Resource identifier.
  /users/physiotherapists/{physiotherapistID}/patients/exercises:
    get:
      tags:
      - Physiotherapists
      summary: Exercises of patients
      operationId: get_users_physiotherapists_physiotherapistID_patients_exercises
      description: 'Exercises of patients. Authorization: physiotherapist.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExercisesOfPatients'
              example:
                patientsExercises:
                - id: 10000000-0000-4000-8000-000000000001
                  name: Example Patient
                  planId: 1
                  dailyListId: 1
                  exercises:
                  - id: 1
                    exerciseInfoID: 10000000-0000-4000-8000-000000000001
                    title: Wrist rehabilitation
                    description: Example description
                    type: Example type
                    sets: 1
                    reps: 1
                    isDone: true
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
