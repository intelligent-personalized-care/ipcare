components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AllPhysiotherapistsAvailableOutput:
      type: object
      properties:
        physiotherapists:
          type: array
          items:
            $ref: '#/components/schemas/PhysiotherapistAvailable'
      required:
      - physiotherapists
    ListOfUnverifiedPhysiotherapists:
      type: object
      properties:
        physiotherapists:
          type: array
          items:
            $ref: '#/components/schemas/PhysiotherapistInfo'
      required:
      - physiotherapists
    PhysiotherapistAvailable:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        rating:
          oneOf:
          - $ref: '#/components/schemas/Rating'
          - type: object
            nullable: true
            enum:
            - null
        requested:
          type: boolean
      required:
      - id
      - name
      - email
      - requested
    PhysiotherapistDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
      required:
      - id
      - name
      - email
    PhysiotherapistFeedBack:
      type: object
      properties:
        feedBack:
          type: string
      required:
      - feedBack
    PhysiotherapistInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    PhysiotherapistOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        rating:
          $ref: '#/components/schemas/Rating'
        hasRated:
          type: boolean
          description: Whether the authenticated patient has already rated this physiotherapist.
      required:
      - id
      - name
      - email
      - rating
    PhysiotherapistProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        rating:
          $ref: '#/components/schemas/Rating'
        docState:
          type: string
          nullable: true
          enum:
          - invalid
          - waiting
          - valid
          - null
      required:
      - id
      - name
      - email
      - rating
    PatientOfPhysiotherapist:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        weight:
          type: integer
          format: int32
          nullable: true
        height:
          type: integer
          format: int32
          nullable: true
        physicalCondition:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanOfPatient'
      required:
      - id
      - name
      - email
      - plans
    RatePhysiotherapist:
      type: object
      properties:
        rate:
          type: integer
          format: int32
      required:
      - rate
    RequestPhysiotherapist:
      type: object
      properties:
        requestID:
          type: string
          format: uuid
        name:
          type: string
        requestText:
          type: string
          nullable: true
        patientID:
          type: string
          format: uuid
      required:
      - requestID
      - name
      - requestText
      - patientID
    RequestsOfPhysiotherapist:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/RequestInformation'
      required:
