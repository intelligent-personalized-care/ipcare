          type: integer
          format: int32
        exerciseInfoID:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        type:
          type: string
        sets:
          type: integer
          format: int32
        reps:
          type: integer
          format: int32
        isDone:
          type: boolean
          nullable: true
      required:
      - id
      - exerciseInfoID
      - title
      - description
      - type
      - sets
      - reps
    DailyListInput:
      type: object
      properties:
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
      required:
      - exercises
    DailyListOutput:
      type: object
      properties:
        id:
          type: integer
          format: int32
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/DailyExercise'
      required:
      - id
      - exercises
    Decision:
      type: object
      properties:
        accept:
          type: boolean
      required:
      - accept
      example:
        accept: true
    Exercise:
      type: object
      properties:
        exerciseInfoID:
          type: string
          format: uuid
        sets:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
        reps:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        sensorProfile:
          oneOf:
          - $ref: '#/components/schemas/SensorProfile'
          - type: object
            nullable: true
            enum:
            - null
          description: Optional per-plan-day override. Omit or null to inherit catalogue defaults. The effective
            profile is also used by the camera.
      required:
      - exerciseInfoID
      - sets
      - reps
      example:
        exerciseInfoID: 73a20000-cc31-4c29-9000-000000000001
        sets: 2
        reps: 10
    ExerciseInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/ExerciseType'
        supportsCamera:
          type: boolean
          nullable: true
        supportsSensors:
          type: boolean
          nullable: true
        raiseThreshold:
          type: number
          format: float
          nullable: true
        lowerThreshold:
          type: number
          format: float
          nullable: true
        cooldownMs:
          type: integer
          format: int32
          nullable: true
        minRaiseTimeMs:
          type: integer
          format: int32
          nullable: true
        holdTimeMs:
          type: integer
          format: int32
          nullable: true
        minMovementSpeed:
          type: number
          format: float
          nullable: true
        maxPitch:
          type: number
          format: float
          nullable: true
        minPitch:
          type: number
          format: float
          nullable: true
        maxRoll:
          type: number
          format: float
          nullable: true
        minRoll:
          type: number
          format: float
          nullable: true
        useRoll:
          type: boolean
          nullable: true
        movementDirection:
          type: integer
          format: int32
          nullable: true
          enum:
          - -1
          - 1
          - null
        cameraJoint:
          type: string
          nullable: true
          enum:
          - WRIST
          - ELBOW
          - KNEE
          - null
        cameraMovement:
          type: string
          nullable: true
          enum:
          - FLEXION
          - EXTENSION
          - null
      required:
      - id
      - title
      - description
      - type
      description: Catalogue defaults. Nullable capabilities/parameters indicate an exercise without a complete
        detection profile; do not invent fallback targets.
      example:
        id: 73a20000-cc31-4c29-9000-000000000001
        title: Wrist Flexion
        description: Support the forearm, palm down. Flex, hold and return to neutral.
        type: Forearms
        supportsCamera: true
        supportsSensors: true
        cameraJoint: WRIST
        cameraMovement: FLEXION
        raiseThreshold: 30.0
        lowerThreshold: 5.0
        minRaiseTimeMs: 1000
        holdTimeMs: 5000
        cooldownMs: 1000
        minMovementSpeed: 0.0
        minPitch: -20.0
        maxPitch: 20.0
        minRoll: -10.0
        maxRoll: 60.0
        useRoll: true
        movementDirection: 1
    ExerciseType:
      type: string
      enum:
      - Legs
      - Shoulders
      - Back
      - Abdominals
      - Chest
      - Forearms
      - Traps
      - Biceps
      - Triceps
    ExercisesOfPatients:
      type: object
      properties:
        patientsExercises:
          type: array
          items:
            $ref: '#/components/schemas/PatientDailyExercises'
      required:
      - patientsExercises
    FeedbackInput:
      type: object
      properties:
        set:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        feedback:
          type: string
        feedbackScore:
          type: string
          nullable: true
          enum: ['1', '2', '3', '4', '5', null]
          description: Optional execution rating, from one to five stars.
      required:
      - set
      - feedback
      example:
        set: 1
        feedback: Keep the forearm supported.
        feedbackScore: '4'
    ListOfExercisesInfo:
      type: object
      properties:
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseInfo'
      required:
      - exercises
    ListOfExercisesOfPatient:
      type: object
      properties:
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
      required:
      - exercises
    ListOfPatients:
      type: object
      properties:
        patients:
          type: array
          items:
            $ref: '#/components/schemas/PatientInformation'
      required:
      - patients
    ListOfPlans:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanInfoOutput'
      required:
      - plans
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
      example:
        email: patient@example.test
        password: Example-password1@
    LoginOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accessToken:
          type: string
        refreshToken:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required:
      - id
      - accessToken
      - refreshToken
      - name
      - role
    PairOfTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
      - accessToken
      - refreshToken
    PatientDailyExercises:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        planId:
          type: integer
          format: int32
        dailyListId:
          type: integer
          format: int32
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/DailyExercise'
      required:
      - id
      - name
      - planId
      - dailyListId
      - exercises
    PatientInformation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
      required:
      - id
      - name
      - email
    PatientOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        weight:
          type: integer
          format: int32
          nullable: true
        height:
          type: integer
          format: int32
          nullable: true
        physicalCondition:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
      required:
      - id
      - name
      - email
    PlanAssociation:
      type: object
      properties:
        title:
          type: string
        startDate:
          type: string
          format: date
      required:
      - title
      - startDate
    PlanID:
      type: object
      properties:
        id:
          type: integer
          format: int32
      required:
      - id
    PlanInfoOutput:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        days:
          type: integer
          format: int32
      required:
      - id
      - title
      - days
    PlanInput:
      type: object
      properties:
        title:
          type: string
        dailyLists:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DailyListInput'
            - type: object
              nullable: true
              enum:
              - null
          description: One entry per day, in order. null is a rest day.
      required:
      - title
      - dailyLists
      example:
        title: Wrist rehabilitation
        dailyLists:
        - exercises:
          - exerciseInfoID: 73a20000-cc31-4c29-9000-000000000001
            sets: 2
            reps: 10
        - null
        - exercises:
          - exerciseInfoID: 73a20000-cc31-4c29-9000-000000000001
            sets: 2
            reps: 10
            sensorProfile:
              raiseThreshold: 40.0
              lowerThreshold: 5.0
              minRaiseTimeMs: 1000
              holdTimeMs: 5000
              cooldownMs: 1000
              minMovementSpeed: 0.0
              minPitch: -20.0
              maxPitch: 20.0
              minRoll: -10.0
              maxRoll: 60.0
              useRoll: true
              movementDirection: 1
    PlanOfPatient:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
      - id
      - title
      - startDate
      - endDate
    PlanOutput:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        startDate:
          type: string
          format: date
          nullable: true
        dailyLists:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DailyListOutput'
            - type: object
              nullable: true
              enum:
              - null
      required:
      - id
      - title
      - dailyLists
      description: For a patient assignment, id and nested daily/exercise ids identify that independent assignment
        snapshot, not the reusable plan template.
    PlanToPatient:
      type: object
      properties:
        planID:
          type: integer
          format: int32
        startDate:
          type: string
          format: date
      required:
      - planID
      - startDate
      example:
        planID: 1
        startDate: '2026-09-20'
    PostedVideo:
      type: object
      properties:
        patientID:
          type: string
          format: uuid
        name:
          type: string
        exerciseID:
          type: integer
          format: int32
      required:
      - patientID
      - name
      - exerciseID
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
          format: int32
      required:
      - title
      - status
      example:
        title: Forbidden request
        status: 400
    Progress:
      type: object
      required:
      - completedSets
      properties:
        completedSets:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 20
      example:
        completedSets:
        - 1
    Rating:
      type: object
      properties:
        averageStarts:
          type: number
          format: float
          description: Backend field spelling is averageStarts (not averageStars).
        nrOfReviews:
          type: integer
          format: int32
      required:
      - averageStarts
      - nrOfReviews
    RatingInput:
      type: object
      properties:
        user:
          type: string
          format: uuid
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
      required:
      - user
      - rating
      example:
        user: 10000000-0000-4000-8000-000000000001
        rating: 5
    RefreshTokenInput:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
      example:
        refreshToken: <refresh-token>
    RegisterInput:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
      required:
      - email
      - name
      - password
      example:
        email: physiotherapist@example.test
        name: Example Physiotherapist
        password: Example-password1@
    RegisterPatientInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        weight:
          type: integer
          format: int32
          nullable: true
        height:
          type: integer
          format: int32
          nullable: true
        birthDate:
          type: string
          nullable: true
        physicalCondition:
          type: string
          nullable: true
      required:
      - name
      - email
      - password
      example:
        name: Example Patient
        email: patient@example.test
        password: Example-password1@
        birthDate: '1995-01-01'
        weight: 70
        height: 175
        physicalCondition: Wrist rehabilitation
    RequestAcceptance:
      type: object
      properties:
        physiotherapist:
          $ref: '#/components/schemas/PhysiotherapistOutput'
      required:
      - physiotherapist
    RequestIdOutput:
      type: object
      properties:
        requestID:
          type: string
          format: uuid
      required:
      - requestID
    RequestInformation:
      type: object
      properties:
        requestID:
          type: string
          format: uuid
        requestText:
          type: string
          nullable: true
        patientID:
          type: string
          format: uuid
        patientName:
          type: string
        patientEmail:
          type: string
      required:
      - requestID
      - patientID
      - patientName
      - patientEmail
    Role:
      type: string
      enum:
      - PATIENT
      - PHYSIOTHERAPIST
      - ADMIN
      description: 'Canonical user roles: PATIENT, PHYSIOTHERAPIST and ADMIN.'
    SensorProfile:
      type: object
      properties:
        raiseThreshold:
          type: number
          format: float
        lowerThreshold:
          type: number
          format: float
        minRaiseTimeMs:
          type: integer
          format: int32
          minimum: 0
          maximum: 60000
          description: Milliseconds.
        holdTimeMs:
          type: integer
          format: int32
          minimum: 0
          maximum: 60000
          description: Milliseconds.
        cooldownMs:
          type: integer
          format: int32
          minimum: 0
          maximum: 60000
          description: Milliseconds.
        minMovementSpeed:
          type: number
          format: float
          minimum: 0
          description: Degrees per second.
        minPitch:
          type: number
          format: float
          minimum: -180
          maximum: 180
          description: Degrees.
        maxPitch:
          type: number
          format: float
          minimum: -180
          maximum: 180
          description: Degrees.
        minRoll:
          type: number
          format: float
          minimum: -180
          maximum: 180
          description: Degrees.
        maxRoll:
          type: number
          format: float
          minimum: -180
          maximum: 180
          description: Degrees.
        useRoll:
          type: boolean
          default: true
        movementDirection:
          type: integer
          format: int32
          default: 1
          enum:
          - -1
          - 1
      required:
      - raiseThreshold
      - lowerThreshold
      - minRaiseTimeMs
      - holdTimeMs
      - cooldownMs
      - minMovementSpeed
      - minPitch
      - maxPitch
      - minRoll
      - maxRoll
      description: Degrees are excursions from calibration. raiseThreshold must exceed lowerThreshold; both must
        fit the selected primary-axis range. minPitch < maxPitch and minRoll < maxRoll. Camera and sensor execution
        share targets and timings; axis/sign are wearable mounting settings.
      example:
        raiseThreshold: 30.0
        lowerThreshold: 5.0
        minRaiseTimeMs: 1000
        holdTimeMs: 5000
        cooldownMs: 1000
        minMovementSpeed: 0.0
        minPitch: -20.0
        maxPitch: 20.0
        minRoll: -10.0
        maxRoll: 60.0
        useRoll: true
        movementDirection: 1
    SensorSample:
      type: object
      properties:
        elapsedMs:
          type: integer
          format: int64
          minimum: 0
        pitch:
          type: number
          format: float
          minimum: -180
          maximum: 180
        roll:
          type: number
          format: float
          minimum: -180
          maximum: 180
        velocity:
          type: number
          format: float
      required:
      - elapsedMs
      - pitch
      - roll
      - velocity
    SensorSessionInput:
      type: object
      properties:
        loadValue:
          type: number
          format: float
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: External weight used for this set in kg. Required when withLoad is true; omitted otherwise.
        loadUnit:
          type: string
          nullable: true
          enum: [kg]
          description: Required as kg when withLoad is true; omitted otherwise.
        withLoad:
          type: boolean
          nullable: true
          description: Patient-reported external load for this set. False means no load; null means not reported (including historical records).
        sessionId:
          type: string
          format: uuid
        set:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
        repetitions:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        durationMs:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400000
        samples:
          type: array
          items:
            $ref: '#/components/schemas/SensorSample'
          minItems: 1
          maxItems: 2000
        profile:
          oneOf:
          - $ref: '#/components/schemas/SensorProfile'
          - type: object
            nullable: true
            enum:
            - null
      required:
      - sessionId
      - set
      - repetitions
      - durationMs
      - samples
      description: Synthetic samples in examples are test data. set must not exceed prescribed sets and repetitions
        must equal prescribed repetitions. Samples are sorted by elapsedMs; each timestamp is between zero and durationMs.
        Reusing the same sessionId with exactly the same payload is idempotent; a different session/payload for
        an occupied set returns 409. Optional profile is the historical snapshot actually used. withLoad is saved with the session and must remain unchanged on retries.
      example:
        sessionId: 20000000-0000-4000-8000-000000000001
        set: 1
        repetitions: 10
        durationMs: 60000
        samples:
        - elapsedMs: 0
          pitch: 0.0
          roll: 0.0
          velocity: 0.0
        - elapsedMs: 1000
          pitch: 1.0
          roll: 30.0
          velocity: 5.0
        profile:
          raiseThreshold: 30.0
          lowerThreshold: 5.0
          minRaiseTimeMs: 1000
          holdTimeMs: 5000
          cooldownMs: 1000
          minMovementSpeed: 0.0
          minPitch: -20.0
          maxPitch: 20.0
          minRoll: -10.0
          maxRoll: 60.0
          useRoll: true
          movementDirection: 1
    VideoFeedBack:
      type: object
      properties:
        loadValue:
          type: number
          format: float
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: External weight used for this set in kg. Required when withLoad is true; omitted otherwise.
        loadUnit:
          type: string
          nullable: true
          enum: [kg]
          description: Required as kg when withLoad is true; omitted otherwise.
        withLoad:
          type: boolean
          nullable: true
          description: Patient-reported external load for this set. False means no load; null means not reported (including historical records).
        patientFeedBack:
          type: string
          nullable: true
        physiotherapistFeedBack:
          type: string
          nullable: true
        executionMode:
          type: string
          nullable: true
        executionScore:
          type: string
          nullable: true
        physiotherapistFeedbackScore:
          type: string
          nullable: true
      required:
      - patientFeedBack
      - physiotherapistFeedBack
      description: Shared feedback for camera and sensor results; executionMode identifies the stored mode.
  responses:
    Error400:
      description: Invalid request, profile or prescription
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Invalid request, profile or prescription
            status: 400
    Error401:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Missing, invalid or expired credentials
            status: 401
    Error403:
      description: Wrong role, owner or patient relationship
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Wrong role, owner or patient relationship
            status: 403
    Error404:
      description: Resource or result not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Resource or result not found
            status: 404
    Error409:
      description: Conflicting record or occupied exercise set
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflicting record or occupied exercise set
            status: 409
