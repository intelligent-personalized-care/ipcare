  /users/subscribe:
    get:
      tags:
      - Users
      summary: Subscribe to server send events
      operationId: get_users_subscribe
      description: 'Long-lived SSE connection for the authenticated user. Response Content-Type: text/event-stream.
        Send Accept: */* (or application/json, as the Android app does): the current controller declares JSON/image
        media types, so an exclusive Accept: text/event-stream can be rejected during Spring route negotiation.
        The event id is the emitter class name; JSON data includes RequestPhysiotherapist, RequestAcceptance, PostedVideo,
        PhysiotherapistFeedBack, PlanAssociation, CredentialAcceptance and RatePhysiotherapist. An initial acceptance
        event is sent. Open manually or opt in using runStreaming in Postman; normal Runner execution skips this
        indefinite stream. Authorization: authenticated user; ownership/relationship checks apply where relevant.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            text/event-stream:
              schema:
                type: string
              example: 'id: PostedVideo

                data: {"patientID":"10000000-0000-4000-8000-000000000001","name":"Example Patient","exerciseID":1}


                '
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /users/unsubscribe:
    post:
      tags:
      - Users
      summary: Unsubscribe to server send events
      operationId: post_users_unsubscribe
      description: 'Unsubscribe to server send events. Authorization: authenticated user; ownership/relationship
        checks apply where relevant.'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No content.
        '400':
